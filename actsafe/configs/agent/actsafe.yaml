defaults:
  - penalizer: lbsgd

name: actsafe
replay_buffer:
  batch_size: 16
  sequence_length: 50
  capacity: 1000
sentiment:
  ensemble_size: 5
  model_initialization_scale: null
  constraint_pessimism: null
  objective_optimism: null
  # "latent" (default, upstream-faithful): kappa * latent epistemic-uncertainty ratio.
  # "cost_spread" (ablation): kappa * std of the decoded cost across the ensemble —
  # pessimism in cost units, directly where the heads disagree.
  constraint_pessimism_source: latent
model:
  hidden_size: 200
  stochastic_size: 60
  deterministic_size: 200
  continuous_time: false  # CT: keep CNNs on pixels; carry the elapsed-time clock as a
                          # scalar alongside the latent (full-MDP time). Set true for CT exps.
  decoder_action_cond: true  # Openloop only: condition reward/cost decoder on the motor
                             # action. Vestigial in openloop (the per-base-step latent
                             # already encodes the ZOH-constant u); false = upstream
                             # state-only decoder. Ignored by flow/discrete.
actor:
  n_layers: 4
  hidden_size: 400
  init_stddev: 5.
  initialization_scale: 0.01
critic:
  n_layers: 3
  hidden_size: 400
actor_optimizer:
  lr: 8e-5
  eps: 1e-5
  clip: 100.0
critic_optimizer:
  lr: 8e-5
  eps: 1e-5
  clip: 100.0
safety_critic_optimizer:
  lr: 8e-5
  eps: 1e-5
  clip: 100.0
model_optimizer:
  lr: 3e-4
  eps: 1e-5
  clip: 100.0
discount: 0.99
safety_discount: 0.99
lambda_: 0.95
# Dreamer-style actor entropy bonus. 0.0 = upstream behavior (no entropy term in the actor
# loss -> some seeds suffer entropy collapse: policy saturates, entropy -> ~-16.57, reward -> 0).
# Set >0 (try 1e-3) to regularize; flows into the objective gradient, also covers the CT dt head.
actor_entropy_coef: 0.0
continuous_time:
  enabled: false
  # Hold-length bounds in REPEAT UNITS (base control steps). The dt head's
  # pseudo-time in [-1, 1] maps affinely to [min_repeat, max_repeat] and is
  # quantized to the NEAREST integer (ties up — makes max_repeat reachable);
  # physical seconds never enter the agent (info['dt'] is debug-only).
  min_repeat: 1
  max_repeat: 50
  switch_cost: 0.1
  dt_exploration: policy  # "uniform": during the warm-up window, replace the dt head of the
                          # EXECUTED action with a uniform pseudo-time in [-1, 1] (policy's
                          # force dims kept), so the buffer contains same-state multi-dt
                          # coverage (oTaCoS-style data assumption) independent of the acting
                          # policy's dt preferences. Real-env rollouts only; imagination and
                          # all losses untouched.
  dt_exploration_steps: null  # sim-step length of the uniform-dt window; null = exploration_steps
  # CT dynamics estimator (2026-07-19 revamp):
  # - "flow": one-shot jump — the RSSM consumes the full action (dt dim included)
  #   and predicts the whole hold's arrival latent in a single step (legacy /
  #   ablation arm).
  # - "openloop": latent-space SwitchCostWrapper — base-step RSSM (motor action
  #   only), a hold is k composed micro-predictions with per-micro-step
  #   reward/cost decodes; k never enters a network (structural k-dependence).
  #   Requires per-step buffer targets (fresh runs only; old pickles hard-fail).
  dynamics: flow
plan_horizon: 15
update_steps: 100
train_every: 1000
beta: 1.0
free_nats: 1.
kl_mix: 0.8
safety_slack: 0.
evaluate_model: false
exploration_strategy: uniform
exploration_steps: 5000
offline_steps: 200000
learn_model_steps: null
exploration_reward_scale: 10.0
exploration_epistemic_scale: 1.
unsupervised: false
reward_scale: 1.