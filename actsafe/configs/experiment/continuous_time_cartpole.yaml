# @package _global_
defaults:
  - override /environment: dm_cartpole
  - override /agent: actsafe

training:
  action_repeat: 1  # Base simulation resolution
  epochs: 300
  safe: true
  safety_budget: 100
  checkpoint_every: 10
  
agent:
  exploration_strategy: opax
  exploration_steps: 1250000
  model:
    continuous_time: true  # strip time_to_go obs channel from SwitchCostWrapper
  actor:
    init_stddev: 5.0
  sentiment:
    constraint_pessimism: 5.0
  replay_buffer:
    sequence_length: 50
  continuous_time:
    enabled: true
    min_time_factor: 1
    max_time_factor: 4
    switch_cost: 0.001
    # base_dt is dynamically inferred at runtime from the env
    
environment:
  dm_cartpole:
    task: safe_swingup_sparse_hard
