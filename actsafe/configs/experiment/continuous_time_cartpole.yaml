# @package _global_
defaults:
  - override /environment: dm_cartpole
  - override /agent: actsafe

training:
  action_repeat: 1  # Base simulation resolution
  epochs: 300
  safe: true
  safety_budget: 100
  checkpoint_every: 10
  
agent:
  offline_steps: 50000
  exploration_strategy: opax
  exploration_steps: 1000000
  model:
    continuous_time: true
  actor:
    init_stddev: 0.025
    initialization_scale: 0.01
  sentiment:
    constraint_pessimism: 2.0
  replay_buffer:
    sequence_length: 50
  continuous_time:
    enabled: true
    min_time_factor: 1
    max_time_factor: 8
    switch_cost: 0.001
    # base_dt is dynamically inferred at runtime from the env
    
environment:
  dm_cartpole:
    task: safe_swingup_sparse_hard
