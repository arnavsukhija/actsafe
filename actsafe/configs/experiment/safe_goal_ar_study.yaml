# @package _global_
# ─────────────────────────────────────────────────────────────────────────────
# Fixed-frequency SAFETY-FREQUENCY study on PointGoal (Safety-Gym).
#
# HYPOTHESIS (falsifiable):
#   Lowering the control frequency (higher action_repeat) increases safety-
#   constraint violations, because a longer open-loop hold is a blind window in
#   which a developing violation cannot be sensed or corrected.
#
# This is pure DISCRETE ActSafe — the upstream-faithful path, NO continuous-time
# machinery. Why that makes the comparison clean:
#   • TimeLimit wraps the BASE env, ActionRepeat wraps that
#     (episodic_async_env.py:193-209) → every action_repeat runs the SAME 1000
#     base steps per episode, just chunked into fewer decisions. Physical episode
#     length is invariant across the sweep → fair frequency comparison.
#   • ActionRepeat sums RAW per-step cost (wrappers.py:26-27, no within-window
#     discounting) → realized episode cost is frequency-invariant.
#   • make_actor_critic scales the discounted budget by action_repeat → the
#     constraint is the SAME "total episode cost <= safety_budget" at every AR.
#
# TASK: go_to_goal (dense reward, 9 hazards + 10 vases). Dense reward is chosen
# deliberately to avoid the do-nothing/exploration-starvation confound seen on
# cartpole: if the agent does nothing it is trivially safe at every frequency and
# the U-shape cannot appear. Once the signal is established, go_to_goal_scarce is
# the harder, paper-faithful variant to confirm on.
#
# Everything below is the paper-standard Safety-Gym ActSafe config; the ONLY thing
# swept is training.action_repeat (on the command line). Do not add other overrides
# to the sweep — the whole point is to isolate frequency.
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  - override /environment: safe_adaptation_gym

environment:
  safe_adaptation_gym:
    task: go_to_goal

training:
  epochs: 100
  safe: true
  action_repeat: 1          # SWEPT on the command line: 1,2,4,8
  safety_budget: 25         # standard Safety-Gym cost limit (total per episode)

agent:
  exploration_strategy: opax
  exploration_steps: 850000 # base steps → exploration phase is same physical
                            # length at every action_repeat
  actor:
    init_stddev: 0.025      # paper default for Safety-Gym (OPAX supplies
                            # exploration here, unlike the cartpole case)
  sentiment:
    model_initialization_scale: 0.05
    # constraint_pessimism intentionally LEFT at the default (null -> bayes/mean
    # cost), matching the paper-faithful Safety-Gym ActSafe. Pessimism (cost-UCB)
    # is a SECONDARY knob for later, not part of this isolation study.
