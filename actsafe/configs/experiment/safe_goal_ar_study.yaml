# @package _global_
# ─────────────────────────────────────────────────────────────────────────────
# Fixed-frequency SAFETY-FREQUENCY study on PointGoal (Safety-Gym).
#
# HYPOTHESIS (falsifiable):
#   Lowering the control frequency (higher action_repeat) increases safety-
#   constraint violations, because a longer open-loop hold is a blind window in
#   which a developing violation cannot be sensed or corrected.
#
# This is pure DISCRETE ActSafe — NO continuous-time machinery.
#
# IMPORTANT — this config is the canonical DENSE go_to_goal config from the paper
# (Fig 4 safety benchmark, upstream `safety_gym.yaml`). The ONLY thing that should
# be swept is training.action_repeat. An earlier version of this file imported
# hyperparameters from the SPARSE/scarce configs (init_stddev=0.025,
# exploration_steps=850k, model_initialization_scale=0.05); those are WRONG for the
# dense task and collapsed reward to ~0. The dense task uses the agent defaults
# (init_stddev=5.0) — do not re-add the scarce values here.
#
# Anchor: action_repeat=2 is the paper-validated baseline (Ĵr ≈ 15–20). Reproduce
# that FIRST with `+experiment=safety_gym` before trusting any swept point.
#
# Fairness across the sweep:
#   • TimeLimit wraps the BASE env, ActionRepeat wraps that → every action_repeat
#     runs the same 1000 base steps per episode, just chunked into fewer decisions.
#   • ActionRepeat sums RAW per-step cost (no within-window discounting) → realized
#     episode cost is frequency-invariant.
#   • make_actor_critic scales the discounted budget by action_repeat so the
#     constraint is the same "total episode cost <= safety_budget" at every AR.
#     NOTE: this makes the AR=2 discounted budget differ from upstream's code
#     (which always divides by time_limit); reconcile before comparing absolute
#     safety numbers to the paper.
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  - override /environment: safe_adaptation_gym

environment:
  safe_adaptation_gym:
    task: go_to_goal          # DENSE reward (Fig 4 safety benchmark)

training:
  epochs: 100
  safe: true
  action_repeat: 2            # SWEPT on the command line: 1,2,4,8 (anchor = 2)
  safety_budget: 25           # standard Safety-Gym cost limit (total per episode)

agent:
  exploration_strategy: opax
  exploration_steps: 500000   # matches upstream safety_gym.yaml (dense)
  sentiment:
    # Deployment safety margin (cost-UCB = mean + kappa*uncertainty). 0.001 (paper
    # safety_gym value) ≈ no margin -> LBSGD parks the agent AT the budget and realized
    # cost overshoots. kappa=0.1 gives a modest honest margin (baseline near/under
    # budget) while staying well clear of the exploration-starvation regime (coupled to
    # OPAX, exploration.py:49). Held CONSTANT across the action_repeat sweep (fair).
    # If reward survives but cost is still >=25, bump toward 0.3-0.5 in a round-2 sweep.
    constraint_pessimism: 0.1
  # actor.init_stddev intentionally NOT set → agent default 5.0 (the dense-task
  # value). Do NOT set 0.025 here; that is the sparse-task value and starves the
  # policy of action exploration on the dense task.
