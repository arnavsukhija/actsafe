# @package _global_
# TASE — Time-Adaptive Safe Exploration on PointGoal. The agent outputs an action +
# a hold-duration dt; SwitchCostWrapper executes the hold and charges a switch_cost.
# Reuses the validated dense go_to_goal AR-study setup. Full rationale, budget/discount
# accounting, and the sweep guidance live in handoff/implementation_plan.md.
#
# SWEEP:
#   agent.continuous_time.switch_cost=0.002,0.01,0.05
#   agent.continuous_time.max_repeat=4,8,16
#   training.seed=0,1,2
defaults:
  - override /environment: safe_adaptation_gym

environment:
  safe_adaptation_gym:
    task: go_to_goal          # DENSE reward (matches the AR-study baseline)

training:
  epochs: 100
  safe: true
  action_repeat: 1            # CT base resolution; the hold is chosen per step by the agent
  safety_budget: 25           # same standard Safety-Gym cost limit as the baseline
  # REVERTED 2026-07-07 (user decision): the full replay buffer (~12GB of uint8 pixel
  # obs at capacity=1000 x max_length=1000) is cloudpickled to state.pkl on EVERY
  # checkpoint; at checkpoint_every=1 (the global default) that's a ~12GB write per
  # epoch (~every 2 min at this fps), which is the diagnosed root cause of the
  # "no space left on device" crashes (every run in actsafe-ct-pointgoal died this
  # way around 1.3-1.65M steps). Atomic tmp+rename also needs ~2x that free during
  # the write. Check sooner in wall-clock time than the old every-epoch cadence.
  checkpoint_every: 10

agent:
  exploration_strategy: opax
  exploration_steps: 500000   # matches the dense baseline
  model:
    continuous_time: true     # strip the appended time-to-go channel before the world model
  sentiment:
    constraint_pessimism: 0.1  # same honest safety margin as the baseline (held fixed)
  actor_entropy_coef: 0.01     # entropy bonus keeps the action + dt heads exploring
  continuous_time:
    enabled: true
    min_repeat: 1              # shortest hold = act every base step (highest frequency)
    max_repeat: 16             # longest hold = 16 base steps (matches AR16)
    switch_cost: 0.01          # per-decision cost; SWEEP {0.002, 0.01, 0.05}
    # "uniform" (2026-07-11, coverage-first fix from the first-principles review):
    # resample the EXECUTED action's dt head uniformly over the full pseudo-time
    # range [-1, 1] during the exploration window. Rationale (code_review.md §3-§4,
    # corrected narrative): OPAX picks dt=1 from its FIRST controlled step — the
    # rational optimum of a per-decision log-squashed bonus with no switch cost in
    # the exploration objective (the earlier "healthy spread then collapse" read of
    # czo8evls misattributed the offline uniform phase to OPAX). The offline phase
    # itself only covered k in [9, 16] (UniformExploration sampled [0, 1); fixed to
    # [-1, 1] on the dt dim). The flow-based model cannot generalize across k it has
    # never seen, so the task phase ran on an unvalidated model — this restores
    # coverage. Gates: train/ct/buffer/frac_dt_q1..q4 balanced during exploration,
    # agent/cost_calibration/gap_k_* ≈ 0 WITH non-trivial count_k_*.
    dt_exploration: uniform
    # 2026-07-19 revamp: openloop dynamics — the world model executes a hold as
    # k open-loop micro-predictions (latent-space SwitchCostWrapper) instead of
    # a one-shot variable-k jump. Rationale (handoff 2026-07-19 section): the
    # eta sweep showed clean teacher-forced per-k calibration but negative
    # imagination/cost_return_gap and per-k recon error growing with k — the
    # one-shot flow prediction itself is the bottleneck. Composition makes the
    # k-dependence structural and the k=1-dominated buffer fully supervising.
    # Set to "flow" for the A/B ablation arm.
    dynamics: openloop
  # If the dt head saturates (train/ct/frac_dt_1 or frac_dt_max ~1, std_dt_ratio ~0),
  # give it its own init std by uncommenting (see handoff):
  # actor:
  #   dt_init_stddev: 15.0
